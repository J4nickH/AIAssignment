<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let newDirection = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let directionQueue = [];

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)

        const endGame = () => {
            clearInterval(gameTimer);
            document.getElementById("info").textContent =
            `Game over! Score: ${score}`;
        };

        const moveSnake = () => {
            // Move the snake
            if (directionQueue.length > 0) {
                direction = directionQueue.shift();
            }
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            if (isOutsideGrid(head) || hitsSnake(head)) {
                endGame();
                return;
            }


            const ateFood = head.x === food.x && head.y === food.y;

            if (ateFood) {
                score++;
                document.getElementById("info").textContent = `Score: ${score}`;
            }

            snake.unshift(head);
            if (!ateFood) {
                snake.pop();
            }
            else {
                score++;
                let newFood;
                do {
                    newFood = createFood();
                } while (isOnSnake(newFood));
                food = newFood;
            }

            


            drawGame();
        };

        const mooveInterval = 300;
        setInterval(moveSnake, mooveInterval);
        // Step 2: Keyboard controls (arrow keys)
        document.addEventListener("keydown", (event) => {
            if (directionQueue.length < 2) {
                switch (event.key) {
                    case "ArrowUp":
                        newDirection = { x: 0, y: -1 };
                        break;
                    case "ArrowDown":
                        newDirection = { x: 0, y: 1 };
                        break;
                    case "ArrowLeft":
                        newDirection = { x: -1, y: 0 };
                        break;
                    case "ArrowRight":
                        newDirection = { x: 1, y: 0 };
                        break;
                }
                const plannedDirection = directionQueue.length
                ? directionQueue[directionQueue.length - 1]
                : direction;

                const isOpposite = newDirection.x === -plannedDirection.x &&
                newDirection.y === -plannedDirection.y;

                if (!isOpposite && directionQueue.length < 2) {
                    directionQueue.push(newDirection);
                }
            }
        });
        // Step 3: Eating and growing
        const createFood = () => {
            return {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        };

        const isOnSnake = (position) =>
        snake.some(segment =>
        segment.x === position.x && segment.y === position.y
        );
    

        // Step 4: Game over
        const isOutsideGrid = (position) => 
            position.x < 0 || position.x >= tileCount ||
            position.y < 0 || position.y >= tileCount;
        
        const hitsSnake = (head) => 
            snake.slice(1).some(segment =>
            segment.x === head.x && segment.y === head.y
        );
        


        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
